# NEO lab for "Multi-vendor firewalls: Palo Alto": the PAN-OS way of writing a security policy (zones as groups of
# interfaces, one named rulebase read top to bottom, address objects, the two default rules intrazone-default and
# interzone-default, a policy-match test, and a candidate configuration that is validated and committed as a whole),
# built on a Linux router.
# fw = a Linux router running nftables with connection tracking (the NEO helper image). It is NOT a Palo Alto firewall:
# there is no PAN-OS here. configs/panos-rules.nft is laid out the PAN-OS way, and configs/panos-reference.txt shows
# the same rulebase in PAN-OS syntax, as text to compare (it is not loaded anywhere).
# Ports: eth1 and eth4 = zone trust (two subnets, one zone), eth2 = zone untrust, eth3 = zone dmz.
# host-a and host-d (trust) and host-b (untrust) run web servers on port 80; host-c (dmz) runs a web server on port 80
# and an SSH server on port 22.
# All addresses are private (RFC 1918): trust 10.41.1.0/24 and 10.41.4.0/24, untrust 10.41.2.0/24, dmz 10.41.3.0/24.
# The untrust zone PLAYS the Internet; the lab never touches the real Internet. The management network uses a ULA
# (fd00::/8) IPv6 range.
# graph-* and neo-* labels only shape the draw.io diagram; they change nothing about the lab.
name: multivendor-firewall-policy

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:172:20:20::/64

topology:
  nodes:
    host-a:
      kind: linux
      image: ghcr.io/neo-fundamentals/neo-tools:1.0.0
      labels: {neo-note: "trust, 10.41.1.10, web :80", graph-icon: host, graph-level: 1, graph-posX: 100, graph-posY: 120}
      exec:
        - ip addr add 10.41.1.10/24 dev eth1
        - ip route replace default via 10.41.1.1
        - sh -c 'echo "hello from host-a (trust, 10.41.1.10)" > /srv/www/index.html'
        - sh -c 'nohup python3 -m http.server 80 --directory /srv/www >/var/log/web.log 2>&1 &'
    host-d:
      kind: linux
      image: ghcr.io/neo-fundamentals/neo-tools:1.0.0
      labels: {neo-note: "trust, 10.41.4.40, web :80", graph-icon: host, graph-level: 1, graph-posX: 100, graph-posY: 380}
      exec:
        - ip addr add 10.41.4.40/24 dev eth1
        - ip route replace default via 10.41.4.1
        - sh -c 'echo "hello from host-d (trust, 10.41.4.40)" > /srv/www/index.html'
        - sh -c 'nohup python3 -m http.server 80 --directory /srv/www >/var/log/web.log 2>&1 &'
    fw:
      kind: linux
      image: ghcr.io/neo-fundamentals/neo-tools:1.0.0
      labels: {neo-note: "Linux nftables, laid out like PAN-OS", graph-icon: router, neo-role: firewall, graph-level: 2, graph-posX: 420, graph-posY: 250}
      binds:
        - configs:/neo/configs:ro
      exec:
        - ip addr add 10.41.1.1/24 dev eth1
        - ip addr add 10.41.2.1/24 dev eth2
        - ip addr add 10.41.3.1/24 dev eth3
        - ip addr add 10.41.4.1/24 dev eth4
        - sysctl -q -w net.ipv4.ip_forward=1
        - nft -f /neo/configs/panos-rules.nft
    host-b:
      kind: linux
      image: ghcr.io/neo-fundamentals/neo-tools:1.0.0
      labels: {neo-note: "untrust, 10.41.2.20, web :80", graph-icon: host, graph-level: 3, graph-posX: 740, graph-posY: 250}
      exec:
        - ip addr add 10.41.2.20/24 dev eth1
        - ip route replace default via 10.41.2.1
        - sh -c 'echo "hello from host-b (untrust, 10.41.2.20)" > /srv/www/index.html'
        - sh -c 'nohup python3 -m http.server 80 --directory /srv/www >/var/log/web.log 2>&1 &'
    host-c:
      kind: linux
      image: ghcr.io/neo-fundamentals/neo-tools:1.0.0
      labels: {neo-note: "dmz, 10.41.3.30, web :80, ssh :22", graph-icon: host, neo-role: server, graph-level: 3, graph-posX: 420, graph-posY: 520}
      exec:
        - ip addr add 10.41.3.30/24 dev eth1
        - ip route replace default via 10.41.3.1
        - sh -c 'echo "hello from host-c (dmz, 10.41.3.30)" > /srv/www/index.html'
        - sh -c 'nohup python3 -m http.server 80 --directory /srv/www >/var/log/web.log 2>&1 &'
        - flock /run/neo-keygen.lock ssh-keygen -A     # waits until this container's host keys exist (the image makes them at start), so sshd below always finds them
        - /usr/sbin/sshd -E /var/log/sshd.log

  links:
    - type: veth  # zone trust, 10.41.1.0/24
      endpoints:
        - {node: host-a, interface: eth1}
        - {node: fw, interface: eth1}
      labels: {neo-net: "trust 10.41.1.0/24", neo-capture: "fw:eth1"}
    - type: veth  # zone trust too, 10.41.4.0/24
      endpoints:
        - {node: host-d, interface: eth1}
        - {node: fw, interface: eth4}
      labels: {neo-net: "trust 10.41.4.0/24", neo-capture: "fw:eth4"}
    - type: veth  # zone untrust, 10.41.2.0/24 (plays the Internet)
      endpoints:
        - {node: fw, interface: eth2}
        - {node: host-b, interface: eth1}
      labels: {neo-net: "untrust 10.41.2.0/24", neo-capture: "fw:eth2"}
    - type: veth  # zone dmz, 10.41.3.0/24
      endpoints:
        - {node: fw, interface: eth3}
        - {node: host-c, interface: eth1}
      labels: {neo-net: "dmz 10.41.3.0/24"}
