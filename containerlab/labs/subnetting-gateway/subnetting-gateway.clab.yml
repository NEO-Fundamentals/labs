# NEO lab for "IPv4 subnetting and CIDR": three hosts and a router on one switch, split into two /26 subnets.
# sw1 = a Linux bridge acting as a switch; host-a/b/c = Linux containers; r1 = FRR router (free public images).
# 10.0.2.128/26 holds host-a (.130) and host-b (.190); 10.0.2.64/26 holds host-c (.66). r1 has an address in each.
# Both subnets share one switch on purpose (see README), so you can see that the mask, not the wire, decides who is "local".
# All addresses are private (RFC 1918). The management network uses a ULA (fd00::/8) IPv6 range.
name: subnetting-gateway

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:172:20:20::/64

topology:
  nodes:
    sw1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      labels: {neo-note: "Linux bridge, a switch", graph-icon: switch, graph-level: 2, graph-posX: 350, graph-posY: 200}
      cmd: sleep infinity
      exec:
        - ip link add br0 type bridge stp_state 0
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0
    host-a:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      labels: {neo-note: "10.0.2.130/26, gateway .129", graph-icon: host, graph-level: 1, graph-posX: 100, graph-posY: 80}
      exec:
        - ip addr add 10.0.2.130/26 dev eth1
        - ip route replace default via 10.0.2.129 dev eth1
        - sysctl -w net.ipv4.conf.all.accept_redirects=0
    host-b:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      labels: {neo-note: "10.0.2.190/26, gateway .129", graph-icon: host, neo-role: server, graph-level: 1, graph-posX: 100, graph-posY: 320}
      cmd: sleep infinity
      exec:
        - ip addr add 10.0.2.190/26 dev eth1
        - ip route replace default via 10.0.2.129 dev eth1
        - sysctl -w net.ipv4.conf.all.accept_redirects=0
        - sh -c "nohup python3 -m http.server 8080 --bind 10.0.2.190 >/dev/null 2>&1 &"
    host-c:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      labels: {neo-note: "10.0.2.66/26, gateway .65", graph-icon: host, graph-level: 3, graph-posX: 600, graph-posY: 320}
      exec:
        - ip addr add 10.0.2.66/26 dev eth1
        - ip route replace default via 10.0.2.65 dev eth1
        - sysctl -w net.ipv4.conf.all.accept_redirects=0
    r1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      labels: {neo-note: "FRR, .129 and .65", graph-icon: router, graph-level: 3, graph-posX: 600, graph-posY: 80}
      startup-config: configs/r1-frr.conf
      exec:
        - sysctl -w net.ipv4.conf.all.send_redirects=0
        - sysctl -w net.ipv4.conf.eth1.send_redirects=0

  links:
    - type: veth
      endpoints:
        - {node: host-a, interface: eth1}
        - {node: sw1, interface: eth1}
      labels: {neo-net: "10.0.2.128/26", neo-capture: "host-a:eth1"}
    - type: veth
      endpoints:
        - {node: host-b, interface: eth1}
        - {node: sw1, interface: eth2}
      labels: {neo-net: "10.0.2.128/26"}
    - type: veth
      endpoints:
        - {node: host-c, interface: eth1}
        - {node: sw1, interface: eth3}
      labels: {neo-net: "10.0.2.64/26"}
    - type: veth
      endpoints:
        - {node: r1, interface: eth1}
        - {node: sw1, interface: eth4}
      labels: {neo-net: ".129/26 and .65/26"}
