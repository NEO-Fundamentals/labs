frr defaults traditional
hostname r1
log file /tmp/frr.log informational
!
interface eth1
 ip address 10.38.1.1/24
 ip ospf area 0
 ip ospf passive
exit
!
interface eth2
 ip address 10.38.12.1/30
 ip ospf area 0
 ip ospf network point-to-point
exit
!
router ospf
 ospf router-id 10.38.255.1
 log-adjacency-changes
exit
!
