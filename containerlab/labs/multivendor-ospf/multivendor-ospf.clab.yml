# NEO lab for "Multi-vendor OSPF adjacency": one FRR router and one Nokia SR Linux router become OSPF neighbours.
# r1 = FRR (free, Cisco-style CLI), r2 = Nokia SR Linux (free public image). host-1 and host-2 = Linux containers.
# One point-to-point link in area 0 with the usual timers (hello 10 s, dead 40 s), so the neighbour states are easy to watch.
# The link uses MTU 1500 on both ends, because OSPF neighbours also compare the MTU.
# (r2's config sets its SR Linux ports to 1514 bytes, the 1500-byte IP packet plus the Ethernet header, so its IP MTU is 1500.)
# All addresses are private (RFC 1918). The management network uses a ULA (fd00::/8) IPv6 range.
# graph-* and neo-* labels only shape the draw.io diagram; they change nothing about the lab.
name: multivendor-ospf

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:172:20:20::/64

topology:
  nodes:
    host-1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.38.1.10, gw 10.38.1.1", graph-icon: host, graph-level: 1, graph-posX: 80, graph-posY: 150}
      exec:
        - ip addr add 10.38.1.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.38.1.1
    r1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      labels: {neo-note: "FRR, router-id 10.38.255.1", graph-icon: router, graph-level: 2, graph-posX: 380, graph-posY: 150}
      startup-config: configs/r1-frr.conf
      daemons: [ospfd]
    r2:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:26.7.2
      labels: {neo-note: "SR Linux, router-id 10.38.255.2", graph-icon: router, graph-level: 3, graph-posX: 720, graph-posY: 150}
      startup-config: configs/r2-srl.cli
    host-2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.38.2.10, gw 10.38.2.1", graph-icon: host, graph-level: 4, graph-posX: 1020, graph-posY: 150}
      exec:
        - ip addr add 10.38.2.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.38.2.1

  links:
    - type: veth  # host-1 LAN, 10.38.1.0/24
      mtu: 1500
      endpoints:
        - {node: host-1, interface: eth1}
        - {node: r1, interface: eth1}
      labels: {neo-net: "10.38.1.0/24"}
    - type: veth  # r1 - r2, the OSPF link, 10.38.12.0/30
      mtu: 1500
      endpoints:
        - {node: r1, interface: eth2}
        - {node: r2, interface: ethernet-1/1}
      labels: {neo-net: "10.38.12.0/30", neo-capture: "r1:eth2"}
    - type: veth  # host-2 LAN, 10.38.2.0/24
      mtu: 1500
      endpoints:
        - {node: r2, interface: ethernet-1/2}
        - {node: host-2, interface: eth1}
      labels: {neo-net: "10.38.2.0/24"}
