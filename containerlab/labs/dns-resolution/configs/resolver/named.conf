// resolver: a recursive resolver for the lab client. It answers the client (10.6.1.0/24) and finds every
// answer itself, starting at the lab's own root server (root.hints). It is not authoritative for any zone.
options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion yes;
    allow-query { 10.6.1.0/24; localhost; };
    allow-recursion { 10.6.1.0/24; localhost; };
    // The lab root is not the real Internet root, so the real DNSSEC trust anchor cannot work here.
    dnssec-validation no;
    // Ask each server for the full name, as in the textbook walk (BIND normally hides part of the name).
    qname-minimization off;
    // Answers are cached for at most 5 minutes; failures for at most 30 seconds.
    max-cache-ttl 300;
    max-ncache-ttl 30;
    servfail-ttl 0;
};
zone "." {
    type hint;
    file "/etc/bind/root.hints";
};
