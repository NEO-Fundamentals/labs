// tld: an authoritative-only server. It answers from its own zone file and never looks anything up for anyone.
options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
};
zone "internal." {
    type primary;
    file "/etc/bind/internal.zone";
};
