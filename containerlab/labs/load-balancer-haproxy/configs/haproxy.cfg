# HAProxy, laid out with F5 BIG-IP names. HAProxy, not BIG-IP: the BIG-IP version is in bigip-reference.txt (text only).
#   frontend vs_web  = virtual server: the address (VIP) and port the clients use
#   backend pool_web = pool: the members, the load-balancing method and the health monitor
#   server web-N     = pool member
#   option httpchk   = health monitor (HTTP GET /health every 2 s; 3 failures = down, 2 successes = up again)
#   source address   = lb opens its own connection to the member from 10.22.2.1 (BIG-IP: SNAT automap, self IP)
#   option forwardfor = adds the client's address in the X-Forwarded-For header (BIG-IP: an HTTP profile setting)
#   vs_app/pool_app  = a second virtual server with cookie persistence (BIG-IP: cookie persistence profile, insert)
global
	stats socket /run/haproxy.sock mode 600 level admin
	log stdout format raw local0

defaults
	mode http
	log global
	option httplog
	timeout connect 2s
	timeout client 30s
	timeout server 30s

frontend vs_web
	bind 10.22.1.100:80
	default_backend pool_web

backend pool_web
	balance roundrobin
	option forwardfor
	option httpchk GET /health
	http-check expect status 200
	default-server check inter 2s fall 3 rise 2
	server web-1 10.22.2.11:80
	server web-2 10.22.2.12:80
	server web-3 10.22.2.13:80

frontend vs_app
	bind 10.22.1.100:8080
	default_backend pool_app

backend pool_app
	balance roundrobin
	option forwardfor
	cookie NEO_LB insert indirect nocache
	option httpchk GET /health
	http-check expect status 200
	default-server check inter 2s fall 3 rise 2
	server web-1 10.22.2.11:80 cookie w1
	server web-2 10.22.2.12:80 cookie w2
	server web-3 10.22.2.13:80 cookie w3

# the statistics page (BIG-IP: the pool and member status in the GUI or "show ltm pool")
listen stats
	bind 10.22.1.1:8404
	stats enable
	stats uri /stats
