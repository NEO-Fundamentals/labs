# NEO lab for "Switch Stacking and MLAG": one host, two switches, one bundle.
# leaf1 and leaf2 = Nokia SR Linux (free public image). SR Linux has no MLAG; it does the same job with ESI-LAG, the
# standards-based way (EVPN multihoming, RFC 7432): both leaves put their link to h1 in lag1 with the SAME LACP system ID,
# and tie the two halves together as one Ethernet segment (ESI) that they announce to each other over BGP EVPN.
# The leaves share one Layer 2 segment over VXLAN (VNI 10044) across their direct link (no peer link, no MLAG protocol).
# h1 = Linux host with bond0 (802.3ad/LACP) over eth1 (to leaf1) and eth2 (to leaf2): it sees ONE partner, one bundle.
# h2 (on leaf1) and h3 (on leaf2) are single-homed hosts in the same subnet, 10.44.0.0/24.
# All addresses are private (RFC 1918), the AS number is private (65044). The management network uses a ULA (fd00::/8).
# graph-* and neo-* labels only shape the draw.io diagram; they change nothing about the lab.
name: mlag-dual-homing

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:172:20:20::/64

topology:
  nodes:
    leaf1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:26.7.2
      labels: {neo-note: "SR Linux, lag1 in ES es-h1 (ESI-LAG)", graph-icon: switch, graph-level: 2, graph-posX: 260, graph-posY: 300}
      startup-config: configs/leaf1-srl.cli
    leaf2:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:26.7.2
      labels: {neo-note: "SR Linux, lag1 in ES es-h1 (ESI-LAG)", graph-icon: switch, graph-level: 2, graph-posX: 760, graph-posY: 300}
      startup-config: configs/leaf2-srl.cli
    h1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "bond0 (LACP) 10.44.0.11", graph-icon: host, graph-level: 3, graph-posX: 510, graph-posY: 560}
      exec:
        - ip link add bond0 type bond mode 802.3ad lacp_rate fast miimon 100
        - ip link set eth1 down
        - ip link set eth2 down
        - ip link set eth1 master bond0
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip addr add 10.44.0.11/24 dev bond0
    h2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.44.0.12", graph-icon: host, graph-level: 3, graph-posX: 60, graph-posY: 560}
      exec:
        - ip addr add 10.44.0.12/24 dev eth1
    h3:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.44.0.13", graph-icon: host, graph-level: 3, graph-posX: 960, graph-posY: 560}
      exec:
        - ip addr add 10.44.0.13/24 dev eth1

  links:
    - type: veth  # leaf1 - leaf2: underlay, BGP EVPN, VXLAN
      endpoints:
        - {node: leaf1, interface: ethernet-1/3}
        - {node: leaf2, interface: ethernet-1/3}
      labels: {neo-net: "10.44.12.0/30, iBGP EVPN, VXLAN"}
    - type: veth  # h1 bond0 member 1
      endpoints:
        - {node: leaf1, interface: ethernet-1/1}
        - {node: h1, interface: eth1}
      labels: {neo-lag: "LAG lag1 / bond0", neo-capture: "h1:eth1"}
    - type: veth  # h1 bond0 member 2
      endpoints:
        - {node: leaf2, interface: ethernet-1/1}
        - {node: h1, interface: eth2}
      labels: {neo-lag: "LAG lag1 / bond0", neo-capture: "h1:eth2"}
    - type: veth
      endpoints:
        - {node: leaf1, interface: ethernet-1/2}
        - {node: h2, interface: eth1}
    - type: veth
      endpoints:
        - {node: leaf2, interface: ethernet-1/2}
        - {node: h3, interface: eth1}
