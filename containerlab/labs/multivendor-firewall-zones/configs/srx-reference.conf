# TEXT ONLY: the same policy in Junos SRX syntax ("set" commands), to compare with srx-zones.nft. Nothing in the lab
# loads this file; there is no Junos device in the lab. Addresses are the lab's private ones.
set interfaces ge-0/0/1 unit 0 family inet address 10.40.1.1/24
set interfaces ge-0/0/2 unit 0 family inet address 10.40.2.1/24
set interfaces ge-0/0/3 unit 0 family inet address 10.40.3.1/24
set security zones security-zone trust interfaces ge-0/0/1.0
set security zones security-zone trust host-inbound-traffic system-services ping
set security zones security-zone untrust interfaces ge-0/0/2.0
set security zones security-zone dmz interfaces ge-0/0/3.0
set security address-book global address web-server 10.40.3.30/32
set security policies from-zone trust to-zone untrust policy allow-out match source-address any destination-address any application any
set security policies from-zone trust to-zone untrust policy allow-out then permit
set security policies from-zone untrust to-zone dmz policy web-in match source-address any destination-address web-server application junos-http
set security policies from-zone untrust to-zone dmz policy web-in then permit
set security policies from-zone trust to-zone dmz policy web-trust match source-address any destination-address web-server application junos-http
set security policies from-zone trust to-zone dmz policy web-trust then permit
set security policies default-policy deny-all
