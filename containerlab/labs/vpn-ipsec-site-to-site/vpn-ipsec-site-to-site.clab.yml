# NEO lab for "VPNs: IPsec site-to-site": two sites joined by an IKEv2/IPsec tunnel across a router that plays the
# Internet. gw-a and gw-b = Linux gateways running strongSwan (swanctl), the NEO helper image; the kernel does the
# ESP encryption (xfrm). They are Linux VPN gateways, not a commercial firewall or VPN product.
# wan = FRR. It plays the Internet: it routes between the gateways' outside networks only and has no route to either
# LAN, so site A cannot reach site B except through the tunnel.
# At deploy each gateway starts the IKE daemon (charon) with NO tunnel loaded; Exercise 2 loads it (swanctl --load-all
# reads configs/gw-?-swanctl.conf, mounted as /etc/swanctl/swanctl.conf). changes/ holds the Exercise 4 break.
# All addresses are private (RFC 1918): site A LAN 10.17.1.0/24, site B LAN 10.17.2.0/24, "Internet" 10.17.100.0/24
# and 10.17.200.0/24. The management network uses a ULA (fd00::/8) IPv6 range.
# graph-* and neo-* labels only shape the draw.io diagram; they change nothing about the lab.
name: vpn-ipsec-site-to-site

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:172:20:20::/64

topology:
  nodes:
    host-a:
      kind: linux
      image: ghcr.io/neo-fundamentals/neo-tools:1.0.0
      labels: {neo-note: "site A, 10.17.1.10", graph-icon: host, graph-level: 1, graph-posX: 100, graph-posY: 200}
      exec:
        - ip addr add 10.17.1.10/24 dev eth1
        - ip route replace default via 10.17.1.1
    gw-a:
      kind: linux
      image: ghcr.io/neo-fundamentals/neo-tools:1.0.0
      labels: {neo-note: "strongSwan, outside 10.17.100.1", graph-icon: router, neo-role: firewall, graph-level: 2, graph-posX: 380, graph-posY: 200}
      binds:
        - configs:/neo/configs:ro
        - changes:/neo/changes:ro
        - configs/strongswan.conf:/etc/strongswan.conf:ro
        - configs/gw-a-swanctl.conf:/etc/swanctl/swanctl.conf:ro
      exec:
        - ip addr add 10.17.1.1/24 dev eth1
        - ip addr add 10.17.100.1/24 dev eth2
        - ip route replace default via 10.17.100.2
        - sysctl -q -w net.ipv4.ip_forward=1
        - sh -c 'nohup charon-systemd >/dev/null 2>&1 &'
    wan:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      labels: {neo-note: "FRR, plays the Internet", graph-icon: router, graph-level: 3, graph-posX: 660, graph-posY: 200}
      startup-config: configs/wan-frr.conf
    gw-b:
      kind: linux
      image: ghcr.io/neo-fundamentals/neo-tools:1.0.0
      labels: {neo-note: "strongSwan, outside 10.17.200.1", graph-icon: router, neo-role: firewall, graph-level: 4, graph-posX: 940, graph-posY: 200}
      binds:
        - configs:/neo/configs:ro
        - changes:/neo/changes:ro
        - configs/strongswan.conf:/etc/strongswan.conf:ro
        - configs/gw-b-swanctl.conf:/etc/swanctl/swanctl.conf:ro
      exec:
        - ip addr add 10.17.2.1/24 dev eth1
        - ip addr add 10.17.200.1/24 dev eth2
        - ip route replace default via 10.17.200.2
        - sysctl -q -w net.ipv4.ip_forward=1
        - sh -c 'nohup charon-systemd >/dev/null 2>&1 &'
    host-b:
      kind: linux
      image: ghcr.io/neo-fundamentals/neo-tools:1.0.0
      labels: {neo-note: "site B, 10.17.2.20, web :80", graph-icon: host, neo-role: server, graph-level: 5, graph-posX: 1220, graph-posY: 200}
      exec:
        - ip addr add 10.17.2.20/24 dev eth1
        - ip route replace default via 10.17.2.1
        - sh -c 'echo "hello from host-b (site B, 10.17.2.20)" > /srv/www/index.html'
        - sh -c 'nohup python3 -m http.server 80 --directory /srv/www >/var/log/web.log 2>&1 &'

  links:
    - type: veth  # site A LAN, 10.17.1.0/24
      endpoints:
        - {node: host-a, interface: eth1}
        - {node: gw-a, interface: eth1}
      labels: {neo-net: "site A 10.17.1.0/24", neo-capture: "gw-a:eth1"}
    - type: veth  # "Internet", 10.17.100.0/24
      endpoints:
        - {node: gw-a, interface: eth2}
        - {node: wan, interface: eth1}
      labels: {neo-net: "10.17.100.0/24", neo-capture: "wan:eth1"}
    - type: veth  # "Internet", 10.17.200.0/24
      endpoints:
        - {node: wan, interface: eth2}
        - {node: gw-b, interface: eth2}
      labels: {neo-net: "10.17.200.0/24"}
    - type: veth  # site B LAN, 10.17.2.0/24
      endpoints:
        - {node: gw-b, interface: eth1}
        - {node: host-b, interface: eth1}
      labels: {neo-net: "site B 10.17.2.0/24", neo-capture: "gw-b:eth1"}
