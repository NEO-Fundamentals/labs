# gw-a: one IKEv2 site-to-site tunnel to gw-b.
# Mounted as /etc/swanctl/swanctl.conf; nothing is loaded at deploy. Load it with:  swanctl --load-all
# The pre-shared key below is a lab-only value; real tunnels use a long random key or certificates.
connections {
  site-to-site {
    version = 2
    mobike = no
    local_addrs = 10.17.100.1
    remote_addrs = 10.17.200.1
    proposals = aes256-sha256-modp2048
    local {
      auth = psk
      id = gw-a
    }
    remote {
      auth = psk
      id = gw-b
    }
    children {
      lan-to-lan {
        local_ts = 10.17.1.0/24
        remote_ts = 10.17.2.0/24
        esp_proposals = aes256gcm16-modp2048
        start_action = trap
      }
    }
  }
}
secrets {
  ike-site-to-site {
    id-1 = gw-a
    id-2 = gw-b
    secret = "neo-lab-only-key"
  }
}
