frr defaults traditional
hostname wan
!
! wan plays the Internet between the two sites. It knows only the two gateways' outside networks; it has no route
! to either site's LAN (10.17.1.0/24, 10.17.2.0/24), just as the Internet has no route to private addresses.
interface eth1
 description link to gw-a (site A outside)
 ip address 10.17.100.2/24
exit
!
interface eth2
 description link to gw-b (site B outside)
 ip address 10.17.200.2/24
exit
!
