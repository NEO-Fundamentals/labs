# strongswan.conf for the lab gateways (mounted over /etc/strongswan.conf). It names the plugins the lab needs, so the
# daemon and swanctl do not try (and noisily fail) to load plugins the image does not have, and it writes a short
# log to /var/log/charon.log. The ESP encryption itself (AES-GCM here) is done by the Linux kernel, not by a plugin.
charon-systemd {
  load = random nonce aes sha1 sha2 hmac xcbc kdf gmp mgf1 pem pkcs1 pkcs8 x509 pubkey revocation constraints kernel-netlink socket-default vici updown counters
  journal {
    default = -1
  }
  filelog {
    lab {
      path = /var/log/charon.log
      time_format = %H:%M:%S
      default = 1
      ike_name = yes
      flush_line = yes
    }
  }
}
swanctl {
  load = random nonce aes sha1 sha2 hmac pem pkcs1 pkcs8 x509 pubkey revocation constraints
}
