# Exercise 4 (break): gw-b's tunnel with a different ESP proposal (AES-128-GCM only). gw-a still offers only
# AES-256-GCM, so the two sides share no ESP proposal. Load it on gw-b with:
#   swanctl --load-conns --file /neo/changes/gw-b-esp-aes128.conf
connections {
  site-to-site {
    version = 2
    mobike = no
    local_addrs = 10.17.200.1
    remote_addrs = 10.17.100.1
    proposals = aes256-sha256-modp2048
    local {
      auth = psk
      id = gw-b
    }
    remote {
      auth = psk
      id = gw-a
    }
    children {
      lan-to-lan {
        local_ts = 10.17.2.0/24
        remote_ts = 10.17.1.0/24
        esp_proposals = aes128gcm16-modp2048
        start_action = trap
      }
    }
  }
}
