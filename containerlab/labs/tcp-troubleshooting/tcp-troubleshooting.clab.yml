# NEO lab for "TCP Troubleshooting": one client, one router and one test server, with six faults you switch on and off.
# host-a and host-b = Linux containers, r1 = FRR router (free public images, no vendor account).
# host-b runs a small test server (scripts/tcp-server.py) on ports 8080, 8082, 8083 and 8085; port 8081 is closed on purpose.
# All addresses are private (RFC 1918). The management network uses a ULA (fd00::/8) IPv6 range.
# graph-* and neo-* labels only shape the draw.io diagram; they change nothing about the lab.
name: tcp-troubleshooting

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:172:20:20::/64

topology:
  nodes:
    host-a:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.0.2.10, client", graph-icon: host, graph-level: 1, graph-posX: 100, graph-posY: 200}
      exec:
        - ip addr add 10.0.2.10/24 dev eth1
        - ip route add 172.16.100.0/24 via 10.0.2.1
    r1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      labels: {neo-note: "FRR, MTU fault is set here", graph-icon: router, graph-level: 2, graph-posX: 350, graph-posY: 200}
      startup-config: configs/r1-frr.conf
    host-b:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "172.16.100.20, test server", graph-icon: host, neo-role: server, graph-level: 3, graph-posX: 600, graph-posY: 200}
      cmd: sleep infinity
      binds:
        - scripts:/neo/scripts:ro
      exec:
        - ip addr add 172.16.100.20/24 dev eth1
        - ip route add 10.0.2.0/24 via 172.16.100.1
        - sh -c "nohup python3 /neo/scripts/tcp-server.py serve 8080 >/dev/null 2>&1 &"
        - sh -c "nohup python3 /neo/scripts/tcp-server.py noread 8082 >/dev/null 2>&1 &"
        - sh -c "nohup python3 /neo/scripts/tcp-server.py midreset 8083 >/dev/null 2>&1 &"
        - sh -c "nohup python3 /neo/scripts/tcp-server.py sink 8085 >/dev/null 2>&1 &"

  links:
    - type: veth  # host-a LAN, 10.0.2.0/24
      endpoints:
        - {node: host-a, interface: eth1}
        - {node: r1, interface: eth1}
      labels: {neo-net: "10.0.2.0/24", neo-capture: "host-a:eth1"}
    - type: veth  # host-b LAN, 172.16.100.0/24
      endpoints:
        - {node: r1, interface: eth2}
        - {node: host-b, interface: eth1}
      labels: {neo-net: "172.16.100.0/24"}
