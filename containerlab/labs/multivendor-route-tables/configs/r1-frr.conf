frr defaults traditional
hostname r1
!
interface eth1
 description to r2
 ip address 10.0.12.1/30
exit
!
interface eth2
 description to r3
 ip address 10.0.13.1/30
exit
!
! the whole destination block: next hop r2
ip route 10.100.0.0/24 10.0.12.2
! the upper half of that block is more specific: next hop r3
ip route 10.100.0.128/25 10.0.13.2
! everything else (the default route): next hop r2
ip route 0.0.0.0/0 10.0.12.2
!
