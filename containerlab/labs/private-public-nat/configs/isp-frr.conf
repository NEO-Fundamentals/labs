frr defaults traditional
hostname isp
!
! The stand-in ISP. It knows only its two customer links (192.168.200.0/30 and 192.168.200.4/30, which play
! public addresses in this lab). It has no route to 10.46.1.0/24 or 10.46.2.0/24: private networks are not routed
! on the Internet. The lab file also makes it drop every packet that comes FROM a 10.x address.
!
interface eth1
 description customer site A (rtr-a)
 ip address 192.168.200.1/30
exit
!
interface eth2
 description customer site B (rtr-b)
 ip address 192.168.200.5/30
exit
!
