# Tiny DNS server on host-b, for the DNS response-code captures.
no-resolv
no-hosts
listen-address=172.16.100.20
bind-interfaces
# This server answers only for lab.example. Names below it that do not exist get NXDOMAIN;
# names outside it get REFUSED, because no upstream server is configured.
local=/lab.example/
host-record=www.lab.example,172.16.100.20
