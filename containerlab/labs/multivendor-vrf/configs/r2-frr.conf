!
vrf BLUE
 ip route 10.39.100.0/24 10.39.12.1
exit-vrf
!
interface eth1 vrf RED
 ip address 10.39.12.2/30
exit
!
interface eth2 vrf BLUE
 ip address 10.39.12.2/30
exit
!
interface eth3 vrf RED
 ip address 10.39.200.1/24
exit
!
interface eth4 vrf BLUE
 ip address 10.39.200.1/24
exit
!
