frr defaults traditional
hostname r1
!
interface eth1
 ip address 10.10.1.1/24
 ip ospf area 0
 ip ospf passive
exit
!
interface eth2
 ip address 10.10.12.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface eth3
 ip address 10.10.13.1/30
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
router ospf
 ospf router-id 10.10.255.1
exit
!
