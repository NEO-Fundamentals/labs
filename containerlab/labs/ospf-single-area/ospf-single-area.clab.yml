# NEO lab for "OSPF in a single area": three routers in area 0 build the same map and choose the shortest path.
# r1 and r2 = FRR (free, Cisco-style CLI), r3 = Nokia SR Linux (free public image). host-1 and host-2 = Linux containers.
# r1 - r2 is the short path between the two LANs; r1 - r3 - r2 is the longer backup path.
# Hello 1 s and dead 4 s on every OSPF link (shortened from the usual 10 s and 40 s, so the lab reacts quickly).
# Every link uses MTU 1500 on both ends, because OSPF neighbors also compare the MTU.
# (r3's config sets its SR Linux ports to 1514 bytes, the 1500-byte IP packet plus the Ethernet header, so its IP MTU is 1500.)
# All addresses are private (RFC 1918). The management network uses a ULA (fd00::/8) IPv6 range.
# graph-* and neo-* labels only shape the draw.io diagram; they change nothing about the lab.
name: ospf-single-area

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:172:20:20::/64

topology:
  nodes:
    host-1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.10.1.10, gw 10.10.1.1", graph-icon: host, graph-level: 1, graph-posX: 80, graph-posY: 150}
      exec:
        - ip addr add 10.10.1.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.10.1.1
    r1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      labels: {neo-note: "FRR, router-id 10.10.255.1", graph-icon: router, graph-level: 2, graph-posX: 300, graph-posY: 150}
      startup-config: configs/r1-frr.conf
      daemons: [ospfd]
    r2:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      labels: {neo-note: "FRR, router-id 10.10.255.2", graph-icon: router, graph-level: 3, graph-posX: 800, graph-posY: 150}
      startup-config: configs/r2-frr.conf
      daemons: [ospfd]
    r3:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:26.7.2
      labels: {neo-note: "SR Linux, router-id 10.10.255.3", graph-icon: router, graph-level: 3, graph-posX: 550, graph-posY: 330}
      startup-config: configs/r3-srl.cli
    host-2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.10.2.10, gw 10.10.2.1", graph-icon: host, graph-level: 4, graph-posX: 1070, graph-posY: 150}
      exec:
        - ip addr add 10.10.2.10/24 dev eth1
        - ip route add 10.0.0.0/8 via 10.10.2.1

  links:
    - type: veth  # host-1 LAN, 10.10.1.0/24
      mtu: 1500
      endpoints:
        - {node: host-1, interface: eth1}
        - {node: r1, interface: eth1}
      labels: {neo-net: "10.10.1.0/24"}
    - type: veth  # r1 - r2, the short path, 10.10.12.0/30
      mtu: 1500
      endpoints:
        - {node: r1, interface: eth2}
        - {node: r2, interface: eth2}
      labels: {neo-net: "10.10.12.0/30", neo-capture: "r1:eth2"}
    - type: veth  # r1 - r3, 10.10.13.0/30
      mtu: 1500
      endpoints:
        - {node: r1, interface: eth3}
        - {node: r3, interface: ethernet-1/1}
      labels: {neo-net: "10.10.13.0/30", neo-capture: "r1:eth3"}
    - type: veth  # r3 - r2, 10.10.23.0/30
      mtu: 1500
      endpoints:
        - {node: r3, interface: ethernet-1/2}
        - {node: r2, interface: eth3}
      labels: {neo-net: "10.10.23.0/30"}
    - type: veth  # host-2 LAN, 10.10.2.0/24
      mtu: 1500
      endpoints:
        - {node: r2, interface: eth1}
        - {node: host-2, interface: eth1}
      labels: {neo-net: "10.10.2.0/24"}
