# NEO lab for "The OSI Model": a PC loads a web page by name through one router.
# pc and srv = Linux containers, r1 = FRR router (free public images, no vendor account).
# srv runs a web server (port 80) and a DNS server (port 53); r1 only routes between the two LANs.
# All addresses are private (RFC 1918). The management network uses a ULA (fd00::/8) IPv6 range.
# graph-* and neo-* labels only shape the draw.io diagram; they change nothing about the lab.
name: osi-http-capture

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:172:20:20::/64

topology:
  nodes:
    pc:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.0.2.10", graph-icon: host, graph-level: 1, graph-posX: 100, graph-posY: 200}
      exec:
        - ip addr add 10.0.2.10/24 dev eth1
        - ip route add 172.16.100.0/24 via 10.0.2.1
        - sh -c "echo 'nameserver 172.16.100.80' > /etc/resolv.conf"
    r1:
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      labels: {neo-note: "FRR, routes only", graph-icon: router, graph-level: 2, graph-posX: 350, graph-posY: 200}
      startup-config: configs/r1-frr.conf
    srv:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "172.16.100.80, web + DNS", graph-icon: host, neo-role: server, graph-level: 3, graph-posX: 600, graph-posY: 200}
      cmd: sleep infinity     # keeps the container alive when you stop the web server by hand
      binds:
        - configs/srv/index.html:/usr/share/nginx/html/index.html:ro
        - configs/srv/dnsmasq.conf:/etc/neo/dnsmasq.conf:ro
      exec:
        - ip addr add 172.16.100.80/24 dev eth1
        - ip route add 10.0.2.0/24 via 172.16.100.1
        - dnsmasq --conf-file=/etc/neo/dnsmasq.conf
        - nginx

  links:
    - type: veth  # PC LAN, 10.0.2.0/24
      endpoints:
        - {node: pc, interface: eth1}
        - {node: r1, interface: eth1}
      labels: {neo-net: "10.0.2.0/24", neo-capture: "pc:eth1"}
    - type: veth  # server LAN, 172.16.100.0/24
      endpoints:
        - {node: r1, interface: eth2}
        - {node: srv, interface: eth1}
      labels: {neo-net: "172.16.100.0/24"}
