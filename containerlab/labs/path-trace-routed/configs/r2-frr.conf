frr defaults traditional
hostname r2
!
interface eth1
 description link to fw
 ip address 10.24.23.3/24
exit
!
interface eth2
 description h2 LAN (h2's default gateway)
 ip address 10.24.2.1/24
exit
!
! the way back to h1's side: next hop fw (10.24.23.2)
ip route 10.24.12.0/24 10.24.23.2
ip route 10.24.1.0/24 10.24.23.2
!
