frr defaults traditional
hostname r1
!
interface eth1
 description h1 LAN (h1's default gateway)
 ip address 10.24.1.1/24
exit
!
interface eth2
 description link to fw
 ip address 10.24.12.1/24
exit
!
! everything beyond fw: next hop fw (10.24.12.2)
ip route 10.24.23.0/24 10.24.12.2
ip route 10.24.2.0/24 10.24.12.2
!
