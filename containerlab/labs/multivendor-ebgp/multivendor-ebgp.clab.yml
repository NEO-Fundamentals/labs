# NEO lab for "Multi-vendor eBGP": one eBGP session between two different network operating systems.
# Same topology and configs as ebgp-two-sites (copied so this lesson has its own folder). FREE version (no vendor account needed).
# edge-a = Nokia SR Linux (free public image), edge-b = FRR (free, Cisco-style CLI).
# graph-* and neo-* labels only shape the draw.io diagram (containerlab graph --drawio); they change nothing about the lab.
# All addresses are private: RFC 1918 IPv4, and a ULA (fd00::/8) IPv6 range for the management network.
# AS numbers are private (64512-65534).
name: multivendor-ebgp

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:172:20:20::/64

topology:
  nodes:
    edge-a:
      labels:
        neo-note: "SR Linux, AS 65201"
        graph-posX: 350
        graph-posY: 200
        graph-icon: router
        graph-level: 2
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:26.7.2
      startup-config: configs/edge-a-srl.cli
    edge-b:
      labels:
        neo-note: "FRR, AS 65202"
        graph-posX: 600
        graph-posY: 200
        graph-icon: router
        graph-level: 3
      kind: frr
      image: quay.io/frrouting/frr:containerlab-10.7.1
      startup-config: configs/edge-b-frr.conf
      daemons: [bgpd]
    host-a:
      labels:
        neo-note: "192.168.10.10"
        graph-posX: 100
        graph-posY: 200
        graph-icon: host
        graph-level: 1
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        - ip route add 192.168.20.0/24 via 192.168.10.1
        - ip route add 10.0.12.0/30 via 192.168.10.1
    host-b:
      labels:
        neo-note: "192.168.20.10"
        graph-posX: 850
        graph-posY: 200
        graph-icon: host
        graph-level: 4
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
      exec:
        - ip addr add 192.168.20.10/24 dev eth1
        - ip route add 192.168.10.0/24 via 192.168.20.1
        - ip route add 10.0.12.0/30 via 192.168.20.1

  links:
    - type: veth  # the WAN link, 10.0.12.0/30
      endpoints:
        - {node: edge-a, interface: ethernet-1/1}
        - {node: edge-b, interface: eth1}
      labels: {neo-net: "10.0.12.0/30", neo-capture: "edge-b:eth1"}
    - type: veth  # site A LAN, 192.168.10.0/24
      endpoints:
        - {node: edge-a, interface: ethernet-1/2}
        - {node: host-a, interface: eth1}
      labels: {neo-net: "192.168.10.0/24"}
    - type: veth  # site B LAN, 192.168.20.0/24
      endpoints:
        - {node: edge-b, interface: eth2}
        - {node: host-b, interface: eth1}
      labels: {neo-net: "192.168.20.0/24"}
