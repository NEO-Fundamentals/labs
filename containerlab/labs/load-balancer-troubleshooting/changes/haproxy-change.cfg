# HAProxy, laid out with F5 BIG-IP names (as in NEO-22). HAProxy, not BIG-IP.
#   frontend vs_web  = virtual server: the address (VIP) and port the clients use
#   backend pool_web = pool: the members, round robin and the health monitor
#   option httpchk   = health monitor: HTTP GET /health every 2 s, status 200 expected; 3 failures = down, 2 successes = up
# CHANGE (exercise 4): the monitor now asks /healthz, the health page name of the "new application version".
# The members still run the old version, which only knows /health.
global
	stats socket /run/haproxy.sock mode 600 level admin
	log stdout format raw local0

defaults
	mode http
	log global
	option httplog
	timeout connect 2s
	timeout client 30s
	timeout server 30s

frontend vs_web
	bind 10.23.1.100:80
	default_backend pool_web

backend pool_web
	balance roundrobin
	option forwardfor
	option httpchk GET /healthz
	http-check expect status 200
	default-server check inter 2s fall 3 rise 2
	server web-1 10.23.2.11:80
	server web-2 10.23.2.12:80
	server web-3 10.23.2.13:80

# the statistics page (BIG-IP: the pool and member status, "show ltm pool pool_web members")
listen stats
	bind 10.23.1.1:8404
	stats enable
	stats uri /stats
