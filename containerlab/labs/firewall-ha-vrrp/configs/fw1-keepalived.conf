# fw1: keepalived (VRRP). Two VRRP instances, one per side, in one sync group so that they always move together:
# the firewall that owns the inside virtual address 10.18.1.1 must also own the outside one 10.18.2.1.
# fw1 has priority 150 and fw2 100: when both are healthy, fw1 is the active (MASTER) firewall.
global_defs {
    router_id fw1
}
vrrp_sync_group FW {
    group {
        INSIDE
        OUTSIDE
    }
    notify_master "/neo/scripts/ha-notify.sh primary"
    notify_backup "/neo/scripts/ha-notify.sh backup"
    notify_fault "/neo/scripts/ha-notify.sh fault"
}
vrrp_instance INSIDE {
    state BACKUP
    interface eth1
    virtual_router_id 18
    priority 150
    advert_int 1
    virtual_ipaddress {
        10.18.1.1/24 dev eth1
    }
}
vrrp_instance OUTSIDE {
    state BACKUP
    interface eth2
    virtual_router_id 28
    priority 150
    advert_int 1
    virtual_ipaddress {
        10.18.2.1/24 dev eth2
    }
}
