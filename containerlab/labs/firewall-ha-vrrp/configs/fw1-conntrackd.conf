# Session sync for this firewall. UDP over the dedicated HA link (eth3, 10.18.3.0/24).
# FTFW mode: the standby keeps an external cache; on becoming active, the keepalived
# notify script commits that cache into the kernel session table.
Sync {
    Mode FTFW {
        DisableExternalCache Off
        CommitTimeout 1800
        PurgeTimeout 5
    }
    UDP {
        IPv4_address 10.18.3.2
        IPv4_Destination_Address 10.18.3.3
        Port 3780
        Interface eth3
        SndSocketBuffer 1249280
        RcvSocketBuffer 1249280
        Checksum on
    }
}

General {
    HashSize 8192
    HashLimit 32768
    LogFile on
    Syslog off
    LockFile /var/lock/conntrack.lock
    UNIX {
        Path /var/run/conntrackd.ctl
    }
    NetlinkBufferSize 2097152
    NetlinkBufferSizeMaxGrowth 8388608
    Filter From Userspace {
        Protocol Accept {
            TCP
            UDP
            ICMP
        }
        Address Ignore {
            IPv4_address 172.20.20.0/24
            IPv4_address 10.18.3.0/24
        }
    }
}
