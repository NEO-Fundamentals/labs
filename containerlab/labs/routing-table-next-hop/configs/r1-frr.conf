frr defaults traditional
hostname r1
!
interface eth1
 description host-1 LAN
 ip address 10.1.1.1/24
exit
!
interface eth2
 description transit to r2
 ip address 10.0.12.1/30
exit
!
interface eth3
 description link to sink
 ip address 10.0.99.1/30
exit
!
! host-2's subnet: next hop r2
ip route 10.2.2.0/24 10.0.12.2
! a wider route for the rest of 10.2.0.0/16: next hop sink (which does not forward)
ip route 10.2.0.0/16 10.0.99.2
!
