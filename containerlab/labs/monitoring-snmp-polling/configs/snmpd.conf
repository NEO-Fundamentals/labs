# Net-SNMP agent on r1. SNMPv2c, read-only, community "neo", only from the poller LAN.
# The community string is sent in the clear; a capture of the poller link will show it.
agentAddress udp:10.27.1.1:161
view all included .1
rocommunity neo 10.27.1.0/24 -V all
sysName r1
sysLocation NEO lab
sysContact lab
dontLogTCPWrappersConnects yes
