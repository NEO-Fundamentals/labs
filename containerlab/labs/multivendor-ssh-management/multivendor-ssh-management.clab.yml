# NEO lab for "Multi-vendor SSH management": a management host (admin-host) manages a device over SSH.
# admin-host = Linux container with the OpenSSH client, set to strict host-key checking.
# device = neo-tools (Debian with the OpenSSH server) standing in for the device. Junos and EOS appear as text only.
# No passwords: admin-host logs in as netops with a key that scripts/setup-keys.sh makes after Deploy. No private key is stored here.
# All addresses are private (RFC 1918). The management network uses a ULA (fd00::/8) IPv6 range.
# graph-* and neo-* labels only shape the draw.io diagram; they change nothing about the lab.
name: multivendor-ssh-management

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:172:20:20::/64

topology:
  nodes:
    admin-host:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "192.168.50.10, management host", graph-icon: host, graph-level: 1, graph-posX: 150, graph-posY: 200}
      binds:
        - configs/admin-host/strict.conf:/etc/neo/strict.conf:ro
      exec:
        - ip addr add 192.168.50.10/24 dev eth1
        - install -m 644 -o root -g root /etc/neo/strict.conf /etc/ssh/ssh_config.d/strict.conf     # ssh ignores a config file that root does not own
    device:
      kind: linux
      image: ghcr.io/neo-fundamentals/neo-tools:1.0.0
      labels: {neo-note: "192.168.50.1, device with sshd", graph-icon: host, neo-role: server, graph-level: 2, graph-posX: 500, graph-posY: 200}
      binds:
        - configs/device/sshd_config:/etc/neo/sshd_config:ro
      exec:
        - ip addr add 192.168.50.1/24 dev eth1
        - useradd -m -s /bin/bash -p '*' netops
        - install -d -m 700 -o netops -g netops /home/netops/.ssh
        - flock /run/neo-keygen.lock ssh-keygen -A     # waits until this container's host keys exist (the image makes them at start and holds none), so sshd below always finds them
        - /usr/sbin/sshd -f /etc/neo/sshd_config -E /var/log/sshd.log

  links:
    - type: veth  # the management link, 192.168.50.0/24
      endpoints:
        - {node: admin-host, interface: eth1}
        - {node: device, interface: eth1}
      labels: {neo-net: "192.168.50.0/24", neo-capture: "admin-host:eth1"}
