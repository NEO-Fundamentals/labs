frr defaults traditional
hostname edge-b2
!
interface eth1
 description eBGP to edge-a
 ip address 10.0.13.2/30
exit
!
interface eth2
 description iBGP to edge-b1
 ip address 10.0.23.2/30
exit
!
interface eth3
 description Site B LAN
 ip address 192.168.20.1/24
exit
!
route-map PREPEND-TO-EDGE-A permit 10
 set as-path prepend 65202 65202
exit
!
router bgp 65202
 bgp router-id 10.255.0.3
 no bgp ebgp-requires-policy
 neighbor 10.0.13.1 remote-as 65201
 neighbor 10.0.13.1 description edge-a (eBGP)
 neighbor 10.0.23.1 remote-as 65202
 neighbor 10.0.23.1 description edge-b1 (iBGP)
 !
 address-family ipv4 unicast
  network 192.168.20.0/24
  neighbor 10.0.13.1 route-map PREPEND-TO-EDGE-A out
  neighbor 10.0.23.1 next-hop-self
 exit-address-family
exit
!
