frr defaults traditional
hostname edge-b1
!
interface eth1
 description eBGP to edge-a
 ip address 10.0.12.2/30
exit
!
interface eth2
 description iBGP to edge-b2
 ip address 10.0.23.1/30
exit
!
router bgp 65202
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.12.1 remote-as 65201
 neighbor 10.0.12.1 description edge-a (eBGP)
 neighbor 10.0.23.2 remote-as 65202
 neighbor 10.0.23.2 description edge-b2 (iBGP)
 !
 address-family ipv4 unicast
  neighbor 10.0.23.2 next-hop-self
 exit-address-family
exit
!
