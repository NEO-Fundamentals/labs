# Lighter variant of "Multi-vendor RSTP and MSTP status" for an 8 GB virtual machine.
# sw1 is still Nokia SR Linux (RSTP, priority 4096, the root). sw2 is a Linux bridge running
# classic 802.1D STP, like sw3 already is in the full lab. The triangle, hosts, addresses, timers
# and path costs are the same. Because sw2 is Linux, the sw1-sw2 link also speaks 802.1D (the
# RSTP-versus-802.1D comparison needs the full lab). Deploy this file OR the full lab, not both
# (they share the lab name multivendor-stp-status). All addresses are private (RFC 1918).
# The management network uses a ULA (fd00::/8) IPv6 range.
name: multivendor-stp-status

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:172:20:20::/64

topology:
  nodes:
    sw1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:26.7.2
      labels: {neo-note: "SR Linux, RSTP priority 4096 (root)", graph-icon: switch, graph-level: 2, graph-posX: 420, graph-posY: 180}
      startup-config: configs/sw1-srl.cli
    sw2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "Linux bridge, 802.1D STP priority 32768", graph-icon: switch, graph-level: 3, graph-posX: 180, graph-posY: 460}
      binds:
        - configs/sw2-bridge.sh:/tmp/sw2-bridge.sh:ro
      exec:
        - bash /tmp/sw2-bridge.sh
    sw3:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "Linux bridge, 802.1D STP priority 32768", graph-icon: switch, graph-level: 3, graph-posX: 660, graph-posY: 460}
      exec:
        - ip link add br0 type bridge stp_state 1 priority 32768 hello_time 100 max_age 600 forward_delay 400
        - ip link set br0 address 02:00:00:36:00:03
        - sh -c "for i in eth1 eth2 eth3; do ip link set $i master br0; done"
        - sh -c "for i in eth1 eth2; do bridge link set dev $i cost 2000; done"
        - ip link set br0 up
    h1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.36.0.11", graph-icon: host, graph-level: 1, graph-posX: 420, graph-posY: 0}
      exec:
        - ip addr add 10.36.0.11/24 dev eth1
    h2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.36.0.12", graph-icon: host, graph-level: 4, graph-posX: 0, graph-posY: 620}
      exec:
        - ip addr add 10.36.0.12/24 dev eth1
    h3:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.36.0.13", graph-icon: host, graph-level: 4, graph-posX: 840, graph-posY: 620}
      exec:
        - ip addr add 10.36.0.13/24 dev eth1

  links:
    - type: veth
      endpoints:
        - {node: sw1, interface: ethernet-1/1}
        - {node: sw2, interface: eth1}
      labels: {neo-net: "802.1D", neo-capture: "sw2:eth1"}
    - type: veth
      endpoints:
        - {node: sw1, interface: ethernet-1/2}
        - {node: sw3, interface: eth1}
      labels: {neo-net: "802.1D", neo-capture: "sw3:eth1"}
    - type: veth
      endpoints:
        - {node: sw2, interface: eth2}
        - {node: sw3, interface: eth2}
      labels: {neo-net: "802.1D"}
    - type: veth
      endpoints:
        - {node: sw1, interface: ethernet-1/3}
        - {node: h1, interface: eth1}
    - type: veth
      endpoints:
        - {node: sw2, interface: eth3}
        - {node: h2, interface: eth1}
    - type: veth
      endpoints:
        - {node: sw3, interface: eth3}
        - {node: h3, interface: eth1}
