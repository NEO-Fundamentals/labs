# NEO lab for "Multi-vendor RSTP and MSTP status": one spanning tree, two kinds of switch, two kinds of status output.
# sw1 and sw2 = Nokia SR Linux (free public image): a mac-vrf "lan" running RSTP (SR Linux's per-mac-vrf spanning tree).
# sw3 = a Linux bridge (br0) in a Linux container, running the kernel's classic 802.1D STP (the kernel has no RSTP or MSTP).
# They build one tree together: SR Linux falls back to 802.1D on the ports that face sw3, as RSTP is meant to.
# sw1 has bridge priority 4096 and is the root; sw2 and sw3 keep 32768 and have fixed bridge MACs (02:00:00:36:00:0N),
# so the tie between sw2 and sw3 always goes the same way. Timers are short for the lab: hello 1 s, max age 6 s,
# forward delay 4 s. Every switch-to-switch port has path cost 2000 (the RSTP value for 10 Gb/s), on both kinds of switch.
# All three hosts share 10.36.0.0/24. All addresses are private (RFC 1918); management IPv6 is a ULA.
# graph-* and neo-* labels only shape the draw.io diagram; they change nothing about the lab.
name: multivendor-stp-status

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:172:20:20::/64

topology:
  nodes:
    sw1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:26.7.2
      labels: {neo-note: "SR Linux, RSTP priority 4096 (root)", graph-icon: switch, graph-level: 2, graph-posX: 420, graph-posY: 180}
      startup-config: configs/sw1-srl.cli
    sw2:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:26.7.2
      labels: {neo-note: "SR Linux, RSTP priority 32768", graph-icon: switch, graph-level: 3, graph-posX: 180, graph-posY: 460}
      startup-config: configs/sw2-srl.cli
    sw3:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "Linux bridge, 802.1D STP priority 32768", graph-icon: switch, graph-level: 3, graph-posX: 660, graph-posY: 460}
      exec:
        - ip link add br0 type bridge stp_state 1 priority 32768 hello_time 100 max_age 600 forward_delay 400
        - ip link set br0 address 02:00:00:36:00:03
        - sh -c "for i in eth1 eth2 eth3; do ip link set $i master br0; done"
        - sh -c "for i in eth1 eth2; do bridge link set dev $i cost 2000; done"
        - ip link set br0 up
    h1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.36.0.11", graph-icon: host, graph-level: 1, graph-posX: 420, graph-posY: 0}
      exec:
        - ip addr add 10.36.0.11/24 dev eth1
    h2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.36.0.12", graph-icon: host, graph-level: 4, graph-posX: 0, graph-posY: 620}
      exec:
        - ip addr add 10.36.0.12/24 dev eth1
    h3:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.36.0.13", graph-icon: host, graph-level: 4, graph-posX: 840, graph-posY: 620}
      exec:
        - ip addr add 10.36.0.13/24 dev eth1

  links:
    - type: veth  # sw1 - sw2 (SR Linux to SR Linux: RSTP on both ends)
      endpoints:
        - {node: sw1, interface: ethernet-1/1}
        - {node: sw2, interface: ethernet-1/1}
      labels: {neo-net: "RSTP", neo-capture: "sw2:e1-1"}
    - type: veth  # sw1 - sw3 (SR Linux to Linux bridge: 802.1D)
      endpoints:
        - {node: sw1, interface: ethernet-1/2}
        - {node: sw3, interface: eth1}
      labels: {neo-net: "802.1D", neo-capture: "sw3:eth1"}
    - type: veth  # sw2 - sw3 (SR Linux to Linux bridge: 802.1D); sw3's end blocks
      endpoints:
        - {node: sw2, interface: ethernet-1/2}
        - {node: sw3, interface: eth2}
      labels: {neo-net: "802.1D"}
    - type: veth
      endpoints:
        - {node: sw1, interface: ethernet-1/3}
        - {node: h1, interface: eth1}
    - type: veth
      endpoints:
        - {node: sw2, interface: ethernet-1/3}
        - {node: h2, interface: eth1}
    - type: veth
      endpoints:
        - {node: sw3, interface: eth3}
        - {node: h3, interface: eth1}
