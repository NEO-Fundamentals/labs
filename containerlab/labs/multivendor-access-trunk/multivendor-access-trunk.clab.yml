# NEO lab for "Multi-vendor access and trunk ports": the same VLANs configured on two kinds of switch, joined by a trunk.
# sw1 = Nokia SR Linux (free public image): VLAN 10 and VLAN 20 are mac-vrf network-instances; access ports are untagged
#       subinterfaces, the trunk port has vlan-tagging and one subinterface per VLAN.
# sw2 = a Linux bridge (br0) with VLAN filtering in a Linux container: access ports are "pvid untagged", the trunk port
#       carries VIDs 10 and 20 tagged. The bridge is created with no default VLAN (vlan_default_pvid 0).
# The trunk (sw1 ethernet-1/3 - sw2 eth1) carries VLAN 10 and VLAN 20, both tagged (802.1Q); there is no native VLAN.
# h1 and h3 are in VLAN 10, h2 and h4 in VLAN 20. All four hosts share one subnet, 10.35.0.0/24, on purpose: any
# separation you see comes from the VLANs, not from IP. All addresses are private (RFC 1918); management IPv6 is a ULA.
# graph-* and neo-* labels only shape the draw.io diagram; they change nothing about the lab.
name: multivendor-access-trunk

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:172:20:20::/64

topology:
  nodes:
    h1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "VLAN 10, 10.35.0.11", graph-icon: host, graph-level: 1, graph-posX: 80, graph-posY: 80}
      exec:
        - ip addr add 10.35.0.11/24 dev eth1
    h2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "VLAN 20, 10.35.0.21", graph-icon: host, graph-level: 1, graph-posX: 80, graph-posY: 380}
      exec:
        - ip addr add 10.35.0.21/24 dev eth1
    sw1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:26.7.2
      labels: {neo-note: "SR Linux, mac-vrf vlan10 and vlan20", graph-icon: switch, graph-level: 2, graph-posX: 380, graph-posY: 230}
      startup-config: configs/sw1-srl.cli
    sw2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "Linux bridge, VLAN filtering", graph-icon: switch, graph-level: 3, graph-posX: 760, graph-posY: 230}
      exec:
        - ip link add br0 type bridge vlan_filtering 1 vlan_default_pvid 0
        - sh -c "for i in eth1 eth2 eth3; do ip link set $i master br0; done"
        # eth1 = the trunk: VLANs 10 and 20, tagged
        - bridge vlan add dev eth1 vid 10
        - bridge vlan add dev eth1 vid 20
        # eth2 = access port in VLAN 10, eth3 = access port in VLAN 20 (untagged; pvid = the VLAN for untagged frames in)
        - bridge vlan add dev eth2 vid 10 pvid untagged
        - bridge vlan add dev eth3 vid 20 pvid untagged
        - ip link set br0 up
    h3:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "VLAN 10, 10.35.0.12", graph-icon: host, graph-level: 4, graph-posX: 1060, graph-posY: 80}
      exec:
        - ip addr add 10.35.0.12/24 dev eth1
    h4:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "VLAN 20, 10.35.0.22", graph-icon: host, graph-level: 4, graph-posX: 1060, graph-posY: 380}
      exec:
        - ip addr add 10.35.0.22/24 dev eth1

  links:
    - type: veth  # h1 access port, VLAN 10
      endpoints:
        - {node: h1, interface: eth1}
        - {node: sw1, interface: ethernet-1/1}
      labels: {neo-net: "access VLAN 10"}
    - type: veth  # h2 access port, VLAN 20
      endpoints:
        - {node: h2, interface: eth1}
        - {node: sw1, interface: ethernet-1/2}
      labels: {neo-net: "access VLAN 20"}
    - type: veth  # the trunk: VLAN 10 and VLAN 20, both tagged
      endpoints:
        - {node: sw1, interface: ethernet-1/3}
        - {node: sw2, interface: eth1}
      labels: {neo-net: "trunk: 10, 20 tagged", neo-capture: "sw2:eth1"}
    - type: veth  # h3 access port, VLAN 10
      endpoints:
        - {node: sw2, interface: eth2}
        - {node: h3, interface: eth1}
      labels: {neo-net: "access VLAN 10"}
    - type: veth  # h4 access port, VLAN 20
      endpoints:
        - {node: sw2, interface: eth3}
        - {node: h4, interface: eth1}
      labels: {neo-net: "access VLAN 20"}
