# Lighter variant of "Port Channels: bundling links with LACP" for an 8 GB virtual machine.
# sw1 is still a Nokia SR Linux switch (same lag1 and LACP config as the full lab). sw2 is Linux: a
# bond (mode 802.3ad / LACP, fast) over eth1 and eth2, bridged to h2 on eth3. That needs a few MB
# instead of about 1.9 GB. The hosts, addresses and the two-member bundle are the same.
# Deploy this file OR the full lab, not both (they share the lab name port-channel-lacp, so the
# container names stay clab-port-channel-lacp-*). All addresses are private (RFC 1918).
# The management network uses a ULA (fd00::/8) IPv6 range.
name: port-channel-lacp

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:172:20:20::/64

topology:
  nodes:
    h1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.43.0.11", graph-icon: host, graph-level: 1, graph-posX: 60, graph-posY: 230}
      exec:
        - ip addr add 10.43.0.11/24 dev eth1
    sw1:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:26.7.2
      labels: {neo-note: "SR Linux switch, lag1 = e1/1 + e1/2, LACP", graph-icon: switch, graph-level: 2, graph-posX: 360, graph-posY: 230}
      startup-config: configs/sw1-srl.cli
    sw2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "Linux bond0 (LACP) + br0 (lighter stand-in for sw2)", graph-icon: switch, graph-level: 3, graph-posX: 760, graph-posY: 230}
      binds:
        - configs/sw2-bond.sh:/tmp/sw2-bond.sh:ro
      exec:
        - bash /tmp/sw2-bond.sh
    h2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.10.0
      labels: {neo-note: "10.43.0.12", graph-icon: host, graph-level: 4, graph-posX: 1060, graph-posY: 230}
      exec:
        - ip addr add 10.43.0.12/24 dev eth1

  links:
    - type: veth
      endpoints:
        - {node: h1, interface: eth1}
        - {node: sw1, interface: ethernet-1/3}
    - type: veth
      endpoints:
        - {node: sw1, interface: ethernet-1/1}
        - {node: sw2, interface: eth1}
      labels: {neo-net: "lag1 / bond0 member 1", neo-lag: "LAG lag1", neo-capture: "sw1:e1-1"}
    - type: veth
      endpoints:
        - {node: sw1, interface: ethernet-1/2}
        - {node: sw2, interface: eth2}
      labels: {neo-net: "lag1 / bond0 member 2", neo-lag: "LAG lag1", neo-capture: "sw1:e1-2"}
    - type: veth
      endpoints:
        - {node: sw2, interface: eth3}
        - {node: h2, interface: eth1}
