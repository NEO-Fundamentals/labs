# srv: dnsmasq as a DHCP server only (port=0 turns its DNS server off).
port=0
interface=eth1
interface=eth2
bind-interfaces
dhcp-authoritative
# LAN A (10.42.10.0/24): client-1 asks on the same cable as the server.
dhcp-range=set:lan-a,10.42.10.100,10.42.10.149,255.255.255.0,2m
dhcp-option=tag:lan-a,option:router,10.42.10.1
# LAN B (10.42.20.0/24): client-2 asks through the relay r1. The server picks this pool because the relay
# writes its own LAN B address (10.42.20.1, the "giaddr") into the request.
dhcp-range=set:lan-b,10.42.20.100,10.42.20.149,255.255.255.0,2m
dhcp-option=tag:lan-b,option:router,10.42.20.1
# Leases are short (2 minutes) so you can watch a renewal in the lab. Real networks use hours or days.
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
log-dhcp
log-facility=/var/log/dnsmasq.log
