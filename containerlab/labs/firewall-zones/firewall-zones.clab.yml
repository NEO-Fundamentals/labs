# NEO lab for "Firewall fundamentals": one firewall between three zones, inside, outside and dmz.
# fw = a Linux router running nftables with connection tracking (the NEO helper image). It is a Linux packet filter,
# not a commercial firewall product. Its ports: eth1 = inside zone, eth2 = outside zone, eth3 = dmz.
# host-a (inside) runs a web server on port 8080; host-b (outside) and host-c (dmz) run web servers on port 80.
# At deploy fw loads the stateful zone policy configs/fw-zones.nft (default deny). The exercises load other policies.
# All addresses are private (RFC 1918): inside 10.13.1.0/24, outside 10.13.2.0/24, dmz 10.13.3.0/24. The outside zone
# PLAYS the Internet; the lab never touches the real Internet. The management network uses a ULA (fd00::/8) IPv6 range.
# graph-* and neo-* labels only shape the draw.io diagram; they change nothing about the lab.
name: firewall-zones

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24
  ipv6-subnet: fd00:172:20:20::/64

topology:
  nodes:
    host-a:
      kind: linux
      image: ghcr.io/neo-fundamentals/neo-tools:1.0.0
      labels: {neo-note: "inside, 10.13.1.10, web :8080", graph-icon: host, neo-role: server, graph-level: 1, graph-posX: 100, graph-posY: 200}
      exec:
        - ip addr add 10.13.1.10/24 dev eth1
        - ip route replace default via 10.13.1.1
        - sh -c 'echo "hello from host-a (inside, 10.13.1.10)" > /srv/www/index.html'
        - sh -c 'nohup python3 -m http.server 8080 --directory /srv/www >/var/log/web.log 2>&1 &'
    fw:
      kind: linux
      image: ghcr.io/neo-fundamentals/neo-tools:1.0.0
      labels: {neo-note: "Linux nftables + conntrack", graph-icon: router, neo-role: firewall, graph-level: 2, graph-posX: 400, graph-posY: 200}
      binds:
        - configs:/neo/configs:ro
      exec:
        - ip addr add 10.13.1.1/24 dev eth1
        - ip addr add 10.13.2.1/24 dev eth2
        - ip addr add 10.13.3.1/24 dev eth3
        - sysctl -q -w net.ipv4.ip_forward=1
        - nft -f /neo/configs/fw-zones.nft
    host-b:
      kind: linux
      image: ghcr.io/neo-fundamentals/neo-tools:1.0.0
      labels: {neo-note: "outside, 10.13.2.20, web :80", graph-icon: host, graph-level: 3, graph-posX: 700, graph-posY: 200}
      binds:
        - scripts:/neo/scripts:ro
      exec:
        - ip addr add 10.13.2.20/24 dev eth1
        - ip addr add 10.13.2.21/24 dev eth1
        - ip route replace default via 10.13.2.1
        - sh -c 'echo "hello from host-b (outside, 10.13.2.20)" > /srv/www/index.html'
        # a name for 10.13.2.20 in /etc/hosts lets the web server start at once (no DNS lookup for its own address)
        - sh -c 'echo "10.13.2.20 host-b-web" >> /etc/hosts'
        - sh -c 'nohup python3 -m http.server 80 --bind 10.13.2.20 --directory /srv/www >/var/log/web.log 2>&1 &'
    host-c:
      kind: linux
      image: ghcr.io/neo-fundamentals/neo-tools:1.0.0
      labels: {neo-note: "dmz, 10.13.3.30, web :80", graph-icon: host, neo-role: server, graph-level: 3, graph-posX: 400, graph-posY: 450}
      exec:
        - ip addr add 10.13.3.30/24 dev eth1
        - ip route replace default via 10.13.3.1
        - sh -c 'echo "hello from host-c (dmz, 10.13.3.30)" > /srv/www/index.html'
        - sh -c 'nohup python3 -m http.server 80 --directory /srv/www >/var/log/web.log 2>&1 &'

  links:
    - type: veth  # inside zone, 10.13.1.0/24
      endpoints:
        - {node: host-a, interface: eth1}
        - {node: fw, interface: eth1}
      labels: {neo-net: "inside 10.13.1.0/24", neo-capture: "fw:eth1"}
    - type: veth  # outside zone, 10.13.2.0/24 (plays the Internet)
      endpoints:
        - {node: fw, interface: eth2}
        - {node: host-b, interface: eth1}
      labels: {neo-net: "outside 10.13.2.0/24", neo-capture: "fw:eth2"}
    - type: veth  # dmz, 10.13.3.0/24
      endpoints:
        - {node: fw, interface: eth3}
        - {node: host-c, interface: eth1}
      labels: {neo-net: "dmz 10.13.3.0/24"}
