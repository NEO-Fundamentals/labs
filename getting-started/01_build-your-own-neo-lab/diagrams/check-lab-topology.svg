<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <rect width="1600" height="700" fill="#0D0D0D"/>
  <text x="60" y="80" fill="#F2EFE8" font-family="Inter, sans-serif" font-size="40" font-weight="700">NEO check lab: two hosts, one router</text>
  <text x="60" y="125" fill="#A8A49B" font-family="Inter, sans-serif" font-size="24">Three Linux network namespaces inside one Ubuntu 24.04 VM. Private lab addresses (RFC 1918).</text>
  <!-- links -->
  <line x1="390" y1="380" x2="640" y2="380" stroke="#F2EFE8" stroke-width="6"/>
  <line x1="960" y1="380" x2="1210" y2="380" stroke="#F2EFE8" stroke-width="6"/>
  <!-- hosts -->
  <rect x="90" y="290" width="300" height="180" rx="18" fill="#1E1E1E" stroke="#F2EFE8" stroke-width="3"/>
  <text x="240" y="355" text-anchor="middle" fill="#F2EFE8" font-family="Inter, sans-serif" font-size="34" font-weight="700">Host A</text>
  <text x="240" y="395" text-anchor="middle" fill="#A8A49B" font-family="Roboto Mono, monospace" font-size="22">namespace neo-a</text>
  <text x="240" y="435" text-anchor="middle" fill="#A8A49B" font-family="Roboto Mono, monospace" font-size="22">gateway 10.0.2.1</text>
  <rect x="640" y="270" width="320" height="220" rx="110" fill="#1E1E1E" stroke="#FF2E1F" stroke-width="4"/>
  <text x="800" y="365" text-anchor="middle" fill="#F2EFE8" font-family="Inter, sans-serif" font-size="34" font-weight="700">R1</text>
  <text x="800" y="405" text-anchor="middle" fill="#A8A49B" font-family="Roboto Mono, monospace" font-size="22">namespace neo-r1</text>
  <text x="800" y="440" text-anchor="middle" fill="#A8A49B" font-family="Roboto Mono, monospace" font-size="22">forwards IPv4</text>
  <rect x="1210" y="290" width="300" height="180" rx="18" fill="#1E1E1E" stroke="#F2EFE8" stroke-width="3"/>
  <text x="1360" y="355" text-anchor="middle" fill="#F2EFE8" font-family="Inter, sans-serif" font-size="34" font-weight="700">Host B</text>
  <text x="1360" y="395" text-anchor="middle" fill="#A8A49B" font-family="Roboto Mono, monospace" font-size="22">namespace neo-b</text>
  <text x="1360" y="435" text-anchor="middle" fill="#A8A49B" font-family="Roboto Mono, monospace" font-size="22">listens on TCP 8080</text>
  <!-- interface labels -->
  <text x="240" y="520" text-anchor="middle" fill="#F2EFE8" font-family="Roboto Mono, monospace" font-size="24">a-eth0 10.0.2.10/24</text>
  <text x="640" y="540" text-anchor="middle" fill="#F2EFE8" font-family="Roboto Mono, monospace" font-size="24">r1-eth0 10.0.2.1/24</text>
  <text x="960" y="540" text-anchor="middle" fill="#F2EFE8" font-family="Roboto Mono, monospace" font-size="24">r1-eth1 172.16.100.1/24</text>
  <text x="1360" y="520" text-anchor="middle" fill="#F2EFE8" font-family="Roboto Mono, monospace" font-size="24">b-eth0 172.16.100.20/24</text>
  <text x="515" y="360" text-anchor="middle" fill="#A8A49B" font-family="Roboto Mono, monospace" font-size="20">10.0.2.0/24</text>
  <text x="1085" y="360" text-anchor="middle" fill="#A8A49B" font-family="Roboto Mono, monospace" font-size="20">172.16.100.0/24</text>
  <!-- capture point -->
  <circle cx="420" cy="380" r="16" fill="#FF2E1F"/>
  <text x="420" y="260" text-anchor="middle" fill="#FF2E1F" font-family="Inter, sans-serif" font-size="24" font-weight="700">capture here</text>
  <line x1="420" y1="270" x2="420" y2="360" stroke="#FF2E1F" stroke-width="3"/>
  <text x="60" y="630" fill="#A8A49B" font-family="Inter, sans-serif" font-size="22">Test traffic: A pings B three times, then opens one TCP connection to B port 8080 and sends "hello".</text>
</svg>
